#################
### AUTOSTART ###
#################

# exec-once = ~/.config/waybar/scripts/launch.sh
exec-once = uwsm app -- waybar
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- awww-daemon
exec-once = uwsm app -- swaync

# For GTK (Gnome/System apps like Dolphin and Browsers)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# Start the Gnome Keyring daemon
exec-once = gnome-keyring-daemon --start --components=secrets

# For generating the file list cache on login for rofi
exec-once = ~/.local/bin/rofi-update-cache.sh

# For using kde passwords gui for authenticating
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Start custom volume osd using swaync
exec-once = swayosd-server

# For clipboard stuff
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = wl-clip-persist --clipboard regular

# For hyprland stuff
exec-once = hypridle
exec-once = hyprsunset

# JamesDSP for audio equalizer
exec-once = jamesdsp

# KDE Connect notification sync with phone
exec-once = kdeconnect-indicator
