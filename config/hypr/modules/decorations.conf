#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(ffffffff)
    col.inactive_border = rgba(00000000)
    allow_tearing = true 
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 4
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 4
        passes = 3
	    new_optimizations = true
	    ignore_opacity = true
        noise = 0.05
    }
}
