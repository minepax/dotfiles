###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# General
bind = ALT, Tab, cyclenext
bind = $mainMod, Q, killactive
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, C, exec, pkill rofi || $calculator
bind = $mainMod, S, exec, pkill rofi || $filesearch
bindr = $mainMod, $mainMod_L, exec, pkill rofi || $menu
bind = $mainMod, Z, exec, zeditor
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, Y, exec, kitty -e zsh -c "source ~/.zshrc && y; exec zsh"
bind = $mainMod, M, exec, ~/.local/bin/power-menu.sh
bind = $mainMod, W, exec, ~/.local/bin/waybar-refresh.sh
bind = $mainMod, A, exec, swaync-client -t
bind = $mainMod, grave, exec, kitty -e btop

# Float or Fullscreen 
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, F, fullscreen, 1

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, ESCAPE, togglespecialworkspace

bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1

bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, ESCAPE, movetoworkspace, special

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod SHIFT CTRL, left, movetoworkspace, -1
bind = $mainMod SHIFT CTRL, right, movetoworkspace, +1

# Windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Control
binde = , XF86AudioRaiseVolume, exec, ~/.local/bin/volume-osd.sh up
binde = , XF86AudioLowerVolume, exec, ~/.local/bin/volume-osd.sh down
bind  = , XF86AudioMute, exec, ~/.local/bin/volume-osd.sh mute

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots for selection, window and screen respectively
bind = $mainMod SHIFT, S, exec, grimblast --freeze save area - | swappy -f -
bind = $mainMod CTRL, Print, exec, grimblast --notify copysave active
bind = $mainMod, Print, exec, grimblast --notify copysave screen

bind = $mainMod, V, exec, pkill rofi || rofi -modi clipboard:~/.local/bin/cliphist-rofi-img.sh -show clipboard -show-icons -theme-str 'element {orientation: horizontal; padding: 10px;} element-text {vertical-align: 0.5;}'
