general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
}

background {
    monitor =
    # path = screenshot
    path = ~/Pictures/Wallpapers/Meh/Lock Screen - Linux.jpeg
    blur_passes = 2
    blur_size = 4
}

label {
    monitor =
    text = $TIME12
    color = rgb(cccccc)
    font_size = 128
    font_family = SF Pro Display Bold
    position = 0, 380
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgb(cccccc)
    font_size = 32
    font_family = SF Pro Display SemiBold
    position = 0, 260
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 1
    dots_size = 0.30
    dots_spacing = 0.20
    outer_color = rgba(204, 204, 204, 0.5)
    inner_color = rgba(13, 13, 13, 0.7)
    font_color = rgb(cccccc)
    fade_on_empty = true 
    placeholder_text = Password
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}

