[Settings]
gtk-theme-name = Adwaita
gtk-icon-theme-name = Papirus-Dark
gtk-font-name = SF Pro Display Medium 10
gtk-cursor-theme-name = volantes_cursors
gtk-cursor-theme-size = 24
gtk-toolbar-style = 3
