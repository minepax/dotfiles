# theme-changer: begin
general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8

}
shape {
    monitor =
    size = 100%, 100%
    color = rgba(25,29,39,0.6)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(136,192,208)
    inner_color = rgb(25,29,39)
    font_color = rgb(236,239,244)
    fade_on_empty = true
    placeholder_text = Password
    hide_input = false
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    color = rgb(236,239,244)
    font_size = 128
    font_family = SF Pro Display Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, Mahesh
    color = rgb(136,192,208)
    font_size = 32
    font_family = SF Pro Display Bold
    position = 0, 80
    halign = center
    valign = center
}
# theme-changer: end
